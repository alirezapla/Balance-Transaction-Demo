spring:
  application:
    name: concurrent-balance-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balance}
    username: ${DB_USERNAME:balance}
    password: ${DB_PASSWORD:balance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
server:
  port: 8080
logging:
  level:
    com.example.balance.service: INFO

app:
  reconciliation:
    scheduler:
      enabled: ${RECONCILIATION_SCHEDULER_ENABLED:true}
      cron: ${RECONCILIATION_CRON:0 0 2 * * *}
      zone: ${RECONCILIATION_TIME_ZONE:UTC}
